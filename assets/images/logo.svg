    <rect x="30" y="24" width="4" height="4" rx="0.8" fill="#ffffff" opacity="0.9"/>
    <rect x="18" y="34" width="4" height="4" rx="0.8" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="34" width="4" height="4" rx="0.8" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="68" y="29" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" letter-spacing="-0.3" fill="#111827">HAMID RESIDENCY</text>
  <text x="69" y="46" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.8" fill="#1b5e48">KHAGRABARI • COOCH BEHAR</text>
