      <stop offset="0%" stop-color="#0f3b2e"/>
      <stop offset="100%" stop-color="#1b5e48"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c99a4c"/>
      <stop offset="100%" stop-color="#e2b96f"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Mark: Architectural 3-Storey Motif -->
